# `muu` deliberately has no entry here. It is the top-level catch-all, it has no
# single platform home, and inventing one would either flag almost every `muu`
# classification as a mismatch or accept an identity-free bucket as a product
# family. Without a home it cannot be accepted as a peer group, which is the
# correct outcome -- an unknown product type cannot produce a bargain signal.
# `analysis.product_type_evidence` reports this as `no_declared_home` rather
# than as a vocabulary error, because that is what it is.
#
# Declared here so the exemption is auditable in one place. A type that is
# missing a home and is *not* listed below is a mistake, and
# tests/test_enrich_vocabulary.py fails on it.
unhomed:
  - muu

# Restrict classification to a subset while you are still deciding. null = all.
active: null
