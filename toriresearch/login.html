<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Tori Research</title><link rel="stylesheet" href="/static/workspace.css"><script type="module" src="/static/login.js"></script></head><body><main class="login-layout"><section class="login-card"><div class="brand">tori<span>research</span></div><p class="eyebrow">Your market workspace</p><h1 id="login-title">Sign in to your workspace</h1><p class="muted">Research the market. Understand your next trade.</p><p id="login-message" class="notice" role="status" hidden></p><form id="login-form"><label>Username<input name="username" autocomplete="username" required maxlength="150" autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit" class="primary">Sign in</button></form><form id="password-form" hidden><p class="notice">Use at least 15 characters. Changing your password signs out all existing sessions.</p><label>Current password<input name="current_password" type="password" autocomplete="current-password" required maxlength="256"></label><label>New password<input name="new_password" type="password" autocomplete="new-password" required minlength="15" maxlength="256"></label><label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" required minlength="15" maxlength="256"></label><button type="submit" class="primary">Change password</button></form><p class="muted" style="font-size:12px;margin-top:24px">For an account or password reset, contact your workspace developer.</p></section></main></body></html>
