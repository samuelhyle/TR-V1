<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tori Research · Private workspace</title><link rel="stylesheet" href="/static/workspace.css"><script type="module" src="/static/cloud.js"></script></head>
<body data-role="viewer"><div class="viewer-layout"><aside class="sidebar"><div class="brand">tori<span>research</span></div><nav aria-label="Workspace">
<button type="button" data-view="overview">Market overview</button><button type="button" data-view="observations">Observations</button><button type="button" data-view="research">Price research</button><button type="button" data-view="records">Workspace records</button><button type="button" data-view="calculator">Deal calculator</button>
<button type="button" data-view="accounts" data-developer hidden>Accounts</button><button type="button" data-view="dataset" data-developer hidden>Research snapshot</button>
</nav><p class="access-label"><span id="access-name">Seller workspace</span><br><strong id="access-mode">Read-only access</strong></p><div id="account-controls" class="account-controls"></div></aside>
<main class="workspace-main"><header class="page-header"><div><p id="workspace-label" class="eyebrow">Private research workspace</p><h1 id="view-title">Market overview</h1><p id="view-description" class="muted">Stored market evidence for your next trade.</p></div><button id="refresh-view" type="button">Refresh</button></header>
<div class="filters" id="workspace-filters"><label>Market<select id="market-filter"><option value="standard">Standard</option><option value="diili">ToriDiili</option></select></label><label data-observation-filter>Category<select id="category-filter"><option value="">All categories</option></select></label><label data-observation-filter>Municipality<select id="municipality-filter"><option value="">All municipalities</option></select></label><label data-observation-filter>Search<input id="workspace-search" type="search" maxlength="200" placeholder="Search observations"></label></div>
<p id="workspace-message" class="notice error" role="status" hidden></p><div id="workspace-content" aria-live="polite"></div><p id="workspace-freshness" class="muted" style="font-size:12px"></p>
</main></div><dialog id="item-detail" aria-labelledby="detail-title"><div class="detail-head"><h2 id="detail-title">Observation evidence</h2><button id="close-detail" type="button">Close</button></div><div id="detail-content"></div></dialog></body></html>
